<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Am Able</title>
    <style>
      :root { color-scheme: light dark; --bg: #f7f8fb; --fg: #0f172a; --muted: #64748b; --brand: #1d58f1; }
      @media (prefers-color-scheme: dark) { :root { --bg: #070b14; --fg: #e2e8f0; --muted: #94a3b8; } }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center; padding: 16px; box-sizing: border-box; }
      img { width: 72px; height: 72px; border-radius: 18px; }
      h1 { font-size: 1.5rem; margin: 20px 0 8px; }
      p { color: var(--muted); max-width: 22rem; margin: 0 auto 24px; line-height: 1.5; }
      button { background: var(--brand); color: #fff; border: 0; border-radius: 12px; padding: 12px 22px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You&rsquo;re offline</h1>
      <p>Am Able needs a connection to load this page. Pages you&rsquo;ve opened before still work offline.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
